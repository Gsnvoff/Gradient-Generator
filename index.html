<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Generator</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<main class="app">
  <aside class="side">
    <header>
      <h1>Gradient Generator</h1>
      <p>Mesh, hero, glass and animated gradients with grain</p>
    </header>

    <section>
      <h2>Pattern</h2>
      <div class="tiles" id="type">
        <button data-type="0"><i></i><span>Mesh</span></button>
        <button data-type="1"><i></i><span>Flow</span></button>
        <button data-type="2"><i></i><span>Swirl</span></button>
        <button data-type="3"><i></i><span>Aurora</span></button>
        <button data-type="4"><i></i><span>Horizon</span></button>
        <button data-type="5"><i></i><span>Fade</span></button>
        <button data-type="6"><i></i><span>Glow</span></button>
        <button data-type="7"><i></i><span>Waves</span></button>
        <button data-type="8"><i></i><span>Prism</span></button>
        <button data-type="9"><i></i><span>Radial</span></button>
      </div>
    </section>

    <section>
      <h2>Soft presets</h2>
      <div class="presets" id="presets-soft"></div>
      <h2 class="gap">Hero presets</h2>
      <div class="presets" id="presets-hero"></div>
      <h2 class="gap">Glass presets</h2>
      <div class="presets" id="presets-glass"></div>
    </section>

    <section>
      <div class="row-head"><h2>Colours</h2><button class="small" id="add">Add colour</button></div>
      <ul class="colors" id="colors"></ul>
      <p class="hint" id="hint"></p>
    </section>

    <section class="sliders">
      <label>Softness <output id="softness-v"></output><input type="range" id="softness" min="0.1" max="1" step="0.01"></label>
      <label>Warp <output id="warp-v"></output><input type="range" id="warp" min="0" max="1" step="0.01"></label>
      <label>Warp scale <output id="scale-v"></output><input type="range" id="scale" min="0.5" max="6" step="0.1"></label>
      <label>Swirl <output id="swirl-v"></output><input type="range" id="swirl" min="-6" max="6" step="0.1"></label>
      <label id="angle-row">Angle <output id="angle-v"></output><input type="range" id="angle" min="0" max="360" step="1"></label>
      <label>Grain <output id="grain-v"></output><input type="range" id="grain" min="0" max="0.3" step="0.005"></label>
    </section>

    <section class="sliders">
      <h2>Glass</h2>
      <div class="tiles" id="glass">
        <button data-glass="0"><i></i><span>None</span></button>
        <button data-glass="1"><i></i><span>Fluted</span></button>
        <button data-glass="2"><i></i><span>Mosaic</span></button>
        <button data-glass="3"><i></i><span>Ripple</span></button>
        <button data-glass="4"><i></i><span>Frosted</span></button>
      </div>
      <div class="sliders" id="glass-sliders">
        <label>Amount <output id="glassAmount-v"></output><input type="range" id="glassAmount" min="0" max="1" step="0.01"></label>
        <label id="strips-row"><span id="strips-label">Strips</span> <output id="strips-v"></output><input type="range" id="strips" min="2" max="48" step="1"></label>
        <label>Shadows <output id="shadows-v"></output><input type="range" id="shadows" min="0" max="1" step="0.01"></label>
        <label>Highlights <output id="highlights-v"></output><input type="range" id="highlights" min="0" max="1" step="0.01"></label>
      </div>
    </section>

    <section class="sliders">
      <div class="row-head"><h2>Motion</h2><label class="switch"><input type="checkbox" id="animate"><span>Animate</span></label></div>
      <label>Speed <output id="speed-v"></output><input type="range" id="speed" min="0.2" max="3" step="0.05"></label>
    </section>

    <section class="actions">
      <button id="shuffle">Shuffle</button>
      <button id="copylink">Copy link</button>
    </section>

    <section>
      <h2>Export</h2>
      <div class="export">
        <select id="size">
          <option value="1080x1080">Square · 1080 × 1080</option>
          <option value="2048x2048">Square XL · 2048 × 2048</option>
          <option value="1920x1080">Full HD · 1920 × 1080</option>
          <option value="3840x2160">4K · 3840 × 2160</option>
          <option value="1290x2796">Phone · 1290 × 2796</option>
          <option value="3456x2234">MacBook Pro 16" · 3456 × 2234</option>
          <option value="custom">Custom…</option>
        </select>
        <div class="custom" id="custom" hidden>
          <input type="number" id="cw" min="16" max="8192" value="1600" aria-label="Width"> ×
          <input type="number" id="ch" min="16" max="8192" value="1000" aria-label="Height">
        </div>
        <div class="seg" id="format">
          <button data-format="png" class="on">PNG</button>
          <button data-format="jpeg">JPEG</button>
        </div>
        <button class="primary" id="download">Download image</button>
        <button class="secondary" id="video">Download video (one loop)</button>
        <button class="secondary" id="code">Get code</button>
      </div>
    </section>
  </aside>

  <section class="stage">
    <div class="frame" id="frame">
      <canvas id="canvas"></canvas>
      <div class="handles" id="handles"></div>
    </div>
  </section>
</main>

<dialog id="code-dialog">
  <div class="dlg-head">
    <h2>Get code</h2>
    <button class="close" id="code-close" aria-label="Close">×</button>
  </div>
  <div class="seg" id="code-lang">
    <button data-lang="html" class="on">HTML</button>
    <button data-lang="react">React</button>
    <button data-lang="css">CSS</button>
  </div>
  <p class="hint" id="code-note"></p>
  <pre><code id="code-out"></code></pre>
  <div class="dlg-actions">
    <button class="secondary" id="code-save">Download file</button>
    <button class="primary" id="code-copy">Copy code</button>
  </div>
</dialog>

<script src="core.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
